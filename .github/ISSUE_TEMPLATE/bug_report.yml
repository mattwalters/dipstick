name: Bug Report
description: Report an unexpected error, crash, or bug in Dipstick
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior or a minimal Go code example.
      placeholder: |
        1. Run `dipstick ...`
        2. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Go version, OS / architecture, and Dipstick version.
      placeholder: "Go 1.24.0, macOS 15.0 arm64, Dipstick v0.1.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Command Output / Logs
      description: Paste any relevant logs or command outputs.
      render: shell
